name: Fork Sync

# Merges louislam/uptime-kuma into this fork's branches (the order is in
# .github/fork-sync/merge.sh). Every day master and any new feature branch commits go into
# docker-build; on Sundays master also goes into the feature branches. docker-build is built
# into an image and smoke tested before anything is pushed. A merge conflict or a failed test
# pushes nothing and opens an issue. Pushing docker-build starts Nightly Release
# (release-nightly.yml), which publishes the images.
#
# Needs a FORK_SYNC_TOKEN secret: a fine-grained token for this repository with Contents and
# Workflows set to read and write. The default GITHUB_TOKEN can't push changes to workflow
# files, which upstream makes often, and its pushes wouldn't start Nightly Release.

on:
  schedule:
    - cron: "13 9 * * 1-6" # 09:13 UTC, Monday to Saturday
    - cron: "13 9 * * 0" # 09:13 UTC on Sundays, which also update the feature branches
  workflow_dispatch: # Allow manual trigger
    inputs:
      update-features:
        description: Also merge master into the feature branches, like the Sunday run
        type: boolean
        default: false

permissions: {}

concurrency:
  group: fork-sync

env:
  # "true" on the Sunday run (the second cron above, keep the two in step) and on manual runs
  # that ask for it. The push job reads it too, so it repeats exactly the merges that were tested.
  UPDATE_FEATURES: ${{ github.event.schedule == '13 9 * * 0' || inputs.update-features }}

jobs:
  merge-and-test:
    if: github.repository == 'teeks99/uptime-kuma'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      start: ${{ steps.merge.outputs.start }}
      result: ${{ steps.merge.outputs.result }}
      merge_date: ${{ steps.merge.outputs.merge_date }}
      problem: ${{ steps.merge.outputs.problem }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Merge upstream into the fork's branches
        id: merge
        run: .github/fork-sync/merge.sh

      - name: Check out the merged docker-build
        if: steps.merge.outputs.changed == 'true'
        env:
          DOCKER_BUILD: ${{ steps.merge.outputs.docker_build }}
        run: git checkout --quiet --detach "$DOCKER_BUILD"

      # Build the image the way release-nightly.yml does, for amd64 only
      - name: Use Node.js 20
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install dependencies and build the frontend
        if: steps.merge.outputs.changed == 'true'
        run: npm clean-install --no-fund && npm run build

      - name: Build the nightly image
        if: steps.merge.outputs.changed == 'true'
        run: docker build --file docker/dockerfile --target nightly --tag uptime-kuma:fork-sync .

      - name: Smoke test the image
        if: steps.merge.outputs.changed == 'true'
        run: .github/fork-sync/smoke-test.sh uptime-kuma:fork-sync

  # A separate job, so the token is never in the environment of a step that runs npm packages'
  # install scripts
  push:
    needs: merge-and-test
    if: needs.merge-and-test.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      reason: ${{ steps.push.outputs.reason }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The same starting commits and date make the same commits that were tested
      - name: Repeat the tested merges
        id: merge
        env:
          START: ${{ needs.merge-and-test.outputs.start }}
          MERGE_DATE: ${{ needs.merge-and-test.outputs.merge_date }}
          EXPECT: ${{ needs.merge-and-test.outputs.result }}
        run: .github/fork-sync/merge.sh

      - name: Push
        id: push
        env:
          TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          REFSPECS: ${{ steps.merge.outputs.push }}
        run: |
          # A token has no spaces or line breaks, but a pasted secret can
          TOKEN=${TOKEN//[[:space:]]/}
          if [[ -z $TOKEN ]]; then
              echo "reason=The FORK_SYNC_TOKEN secret is missing." >> "$GITHUB_OUTPUT"
              echo "::error::The FORK_SYNC_TOKEN secret is missing"
              exit 1
          fi
          echo "::add-mask::$TOKEN"
          # All branches or none. Not forced, so a branch that moved since the merge is
          # rejected instead of overwritten.
          read -ra refspecs <<< "$REFSPECS"
          log=$RUNNER_TEMP/push.log
          status=0
          git push --atomic "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" "${refspecs[@]}" 2> "$log" || status=$?
          cat "$log" >&2
          if ((status != 0)); then
              # What git and GitHub said, for the sync issue
              {
                  echo "reason<<END_OF_REASON"
                  grep -E '^(remote: |fatal: | ! )' "$log" | head -n 10 || true
                  echo "END_OF_REASON"
              } >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

  report:
    needs: [merge-and-test, push]
    if: ${{ !cancelled() && github.repository == 'teeks99/uptime-kuma' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # open, comment on and close the sync issue

    steps:
      - name: Open, update or close the sync issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TESTED: ${{ needs.merge-and-test.result }}
          PUSHED: ${{ needs.push.result }}
          PROBLEM: ${{ needs.merge-and-test.outputs.problem }}
          PUSH_REASON: ${{ needs.push.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # open_issue <title>: prints the number of the open issue with that title, if any
          open_issue() {
              gh issue list --state open --limit 100 --json number,title \
                  --jq "map(select(.title == \"$1\"))[0].number // empty" || true
          }

          # The weekly run has its own issue, so a clean daily run, which leaves the feature
          # branches alone, can't close an issue about them
          if [[ $UPDATE_FEATURES == true ]]; then
              title="Fork sync of the feature branches failed"
              closes=("$title" "Fork sync failed")
              rerun="run Fork Sync again from the Actions tab with \"Also merge master into the feature branches\" ticked, or wait for next Sunday's run"
          else
              title="Fork sync failed"
              closes=("$title")
              rerun="run Fork Sync again from the Actions tab, or wait for the next scheduled run"
          fi

          # PUSHED is skipped when there was nothing new to push
          if [[ $TESTED == success && $PUSHED != failure ]]; then
              for each in "${closes[@]}"; do
                  issue=$(open_issue "$each")
                  if [[ -n $issue ]]; then
                      gh issue close "$issue" --comment "Fixed: [this run]($RUN_URL) synced cleanly."
                  fi
              done
              exit 0
          fi
          issue=$(open_issue "$title")

          reason=""
          if [[ -n $PROBLEM ]]; then
              problem="$PROBLEM."
              fix="Do the merges by hand, sort out the problem and push."
          elif [[ $TESTED != success ]]; then
              problem="Merging or smoke testing failed, the run shows which step."
              fix="Fix the problem on the branch it belongs to and push."
          else
              problem="Pushing the merged branches failed."
              reason=$PUSH_REASON
              fix="For an authentication or permission error, save a new token in the FORK_SYNC_TOKEN secret: a fine-grained one that can access this repository, with Contents and Workflows set to read and write. If a branch changed while the sync ran (fetch first), nothing needs fixing."
          fi
          body="$problem Nothing was pushed, so the branches and images are unchanged. Details are in [the run]($RUN_URL)."
          if [[ -n $reason ]]; then
              body+=$'\n\n```\n'"$reason"$'\n```'
          fi
          body+=$'\n\n'"$fix Then $rerun. Each failed run adds a comment here, and the first clean run closes this issue."

          if [[ -n $issue ]]; then
              gh issue comment "$issue" --body "$body"
          else
              gh issue create --title "$title" --body "$body" --assignee "$GITHUB_REPOSITORY_OWNER"
          fi
